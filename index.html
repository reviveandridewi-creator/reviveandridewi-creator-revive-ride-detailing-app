<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revive & Ride Detailing OS</title>
    
    <!-- PWA & Mobile Optimization Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#161b22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Revive & Ride">

    <style>
        /* Base Dark Theme Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 5px;
        }
        .metrics-container {
            display: flex;
            justify-content: space-around;
            background: #161b22;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #30363d;
        }
        .metric-card {
            text-align: center;
        }
        .metric-card h3 {
            margin: 0;
            font-size: 0.9rem;
            color: #8b949e;
        }
        .metric-card p {
            margin: 5px 0 0 0;
            font-size: 1.5rem;
            font-weight: bold;
            color: #58a6ff;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        form label {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #8b949e;
        }
        form input, form select, form textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            box-sizing: border-box;
        }
        form button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        form button:hover {
            background: #2ea043;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #30363d;
            font-size: 0.9rem;
        }
        th {
            color: #8b949e;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-badge.paid {
            background: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            border: 1px solid #238636;
        }
        .status-badge.pending {
            background: rgba(210, 153, 34, 0.2);
            color: #d29922;
            border: 1px solid #9e6a03;
        }
        .action-btn {
            padding: 5px 10px;
            margin: 2px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .toggle-btn {
            background: #1f6feb;
            color: white;
        }
        .delete-btn {
            background: #da3633;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Revive & Ride Detailing OS</h1>
        <p style="color: #8b949e; margin: 0;">Internal Operations & Job Tracking</p>
    </header>

    <!-- Metrics Dashboard -->
    <div class="metrics-container">
        <div class="metric-card">
            <h3>Total Revenue</h3>
            <p id="total-revenue">$0.00</p>
        </div>
        <div class="metric-card">
            <h3>Active Jobs</h3>
            <p id="active-jobs-count">0</p>
        </div>
        <div class="metric-card">
            <h3>Pending Invoices</h3>
            <p id="pending-invoices-count">0</p>
        </div>
    </div>

    <div class="main-layout">
        <!-- Job Intake Form Panel -->
        <div class="panel">
            <h2>Log New Job</h2>
            <form id="job-intake-form">
                <label for="client-name">Client Name</label>
                <input type="text" id="client-name" required>

                <label for="client-phone">Phone Number</label>
                <input type="tel" id="client-phone" required>

                <label for="car-year">Vehicle Year</label>
                <input type="text" id="car-year" placeholder="e.g. 2021" required>

                <label for="car-make">Vehicle Make</label>
                <input type="text" id="car-make" placeholder="e.g. Ford" required>

                <label for="car-model">Vehicle Model</label>
                <input type="text" id="car-model" placeholder="e.g. F-150" required>

                <label for="car-color">Color & Plate / Notes</label>
                <input type="text" id="car-color" placeholder="e.g. Black / ABC-1234">

                <label for="service-package">Service Package</label>
                <input type="text" id="service-package" placeholder="e.g. Full Interior Detail" required>

                <label for="inspection-notes">Inspection Notes</label>
                <textarea id="inspection-notes" rows="3" placeholder="Condition, pet hair, stains..."></textarea>

                <label for="job-price">Price ($)</label>
                <input type="number" step="0.01" id="job-price" required>

                <label for="invoice-status">Initial Status</label>
                <select id="invoice-status">
                    <option value="Pending">Pending</option>
                    <option value="Paid">Paid</option>
                </select>

                <button type="submit">Save Job to OS</button>
            </form>
        </div>

        <!-- Jobs Table Panel -->
        <div class="panel">
            <h2>Active Job Logs</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Client & Vehicle</th>
                            <th>Package & Notes</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="jobs-table-body">
                        <!-- Populated dynamically by app.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Main OS Script -->
    <script type="module" src="./app.js"></script>

    <!-- Service Worker Registration for PWA Support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('Service Worker Registered Successfully'))
            .catch((err) => console.log('Service Worker Registration Failed', err));
        });
      }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revive & Ride Detailing OS</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#161b22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Revive OS">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 5px;
        }
        .metrics-container {
            display: flex;
            justify-content: space-around;
            background: #161b22;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #30363d;
        }
        .metric-card {
            text-align: center;
        }
        .metric-card h3 {
            margin: 0;
            font-size: 0.9rem;
            color: #8b949e;
        }
        .metric-card p {
            margin: 5px 0 0 0;
            font-size: 1.5rem;
            font-weight: bold;
            color: #58a6ff;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active-tab {
            background: #1f6feb;
            color: white;
            border-color: #1f6feb;
        }
        .panel {
            background: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #30363d;
            font-size: 0.9rem;
        }
        th {
            color: #8b949e;
        }
        select.status-dropdown {
            background: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .action-btn {
            padding: 5px 10px;
            margin: 2px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            width: 100%;
        }
        .archive-btn {
            background: #238636;
            color: white;
        }
        .unarchive-btn {
            background: #d29922;
            color: white;
        }
        .delete-btn {
            background: #da3633;
            color: white;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <h1>Revive & Ride Detailing OS</h1>
            <p style="color: #8b949e; margin: 0;">Internal Operations & Job Tracking</p>
        </header>

        <!-- Metrics Dashboard -->
        <div class="metrics-container">
            <div class="metric-card">
                <h3>Total Revenue</h3>
                <p id="total-revenue">$0.00</p>
            </div>
            <div class="metric-card">
                <h3>Dashboard Jobs</h3>
                <p id="active-jobs-count">0</p>
            </div>
            <div class="metric-card">
                <h3>Pending Invoices</h3>
                <p id="pending-invoices-count">0</p>
            </div>
        </div>

        <div class="tab-buttons">
            <button id="btn-view-active" class="tab-btn active-tab" onclick="window.toggleView('active')">Active Dashboard</button>
            <button id="btn-view-archive" class="tab-btn" onclick="window.toggleView('archive')">Archived History</button>
        </div>

        <div class="main-layout">
            <!-- Active Jobs Panel -->
            <div id="active-panel" class="panel">
                <h2>Active Job Logs</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Client & Vehicle</th>
                                <th>Package & Notes</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="jobs-table-body">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Archived Jobs Panel -->
            <div id="archive-panel" class="panel" style="display: none;">
                <h2>Past Customers & Archived Logs</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Client & Vehicle</th>
                                <th>Package & Notes</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="archive-table-body">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>
</body>
</html>
